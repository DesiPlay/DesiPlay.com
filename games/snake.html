<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10111b"><title>Snake — DesiPlay</title><link rel="manifest" href="../manifest.webmanifest"><link rel="stylesheet" href="../assets/site.css"></head><body><main class="game-shell"><div class="game-nav"><a class="brand" href="../"><span class="brand-mark">D</span><span>Desi<span class="brand-accent">Play</span><small>PLAY ANYWHERE</small></span></a><a class="back-link" href="../">← All games</a></div><section class="game-panel"><div class="game-heading"><div class="eyebrow" style="justify-content:center">ARCADE RUSH</div><h1>Snake</h1><p>Eat the glowing fruit. Grow longer. Don't hit the wall or yourself.</p></div><div class="score-strip"><span>Score <strong id="score">0</strong></span><span>Best <strong id="best">0</strong></span></div><div class="game-status" id="status" aria-live="polite">Press Start to play</div><div class="snake-wrap"><canvas id="game" class="snake-canvas" width="400" height="400" aria-label="Snake game board"></canvas></div><div class="game-actions"><button class="game-btn" id="start">Start game</button><button class="game-btn secondary" id="pause">Pause</button><button class="game-btn secondary" id="restart">Restart</button></div><div class="direction-pad" aria-label="Touch controls"><button data-dir="up" aria-label="Up">↑</button><button data-dir="left" aria-label="Left">←</button><button data-dir="down" aria-label="Down">↓</button><button data-dir="right" aria-label="Right">→</button></div><p class="game-help">Use arrow keys / WASD or the touch controls. Swipe on the board also works.</p></section></main><script>
(()=>{const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),N=20,S=20;let snake,dir,next,food,score,best=readBest(),timer=null,running=false,over=false;const $=s=>document.querySelector(s);function readBest(){try{return Math.max(0,Number(localStorage.getItem('desiplay-snake-best'))||0);}catch(_error){return 0;}}function saveBest(value){try{localStorage.setItem('desiplay-snake-best',String(value));}catch(_error){}}$('#best').textContent=best;function rand(){return Math.floor(Math.random()*N)}function placeFood(){do{food={x:rand(),y:rand()}}while(snake.some(p=>p.x===food.x&&p.y===food.y));}function init(){snake=[{x:9,y:10},{x:8,y:10},{x:7,y:10}];dir={x:1,y:0};next={...dir};score=0;over=false;running=false;clearInterval(timer);timer=null;$('#score').textContent=score;$('#status').textContent='Press Start to play';placeFood();draw();}function draw(){ctx.fillStyle='#101a1b';ctx.fillRect(0,0,400,400);ctx.strokeStyle='#ffffff0a';for(let i=0;i<=N;i++){ctx.beginPath();ctx.moveTo(i*S,0);ctx.lineTo(i*S,400);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*S);ctx.lineTo(400,i*S);ctx.stroke();}ctx.fillStyle='#ffc76b';ctx.beginPath();ctx.arc(food.x*S+10,food.y*S+10,7,0,Math.PI*2);ctx.fill();snake.forEach((p,i)=>{ctx.fillStyle=i===0?'#d5ff85':'#8caf50';ctx.beginPath();ctx.roundRect(p.x*S+2,p.y*S+2,S-4,S-4,5);ctx.fill();});}function tick(){dir=next;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y},eats=head.x===food.x&&head.y===food.y,body=eats?snake:snake.slice(0,-1);if(head.x<0||head.y<0||head.x>=N||head.y>=N||body.some(p=>p.x===head.x&&p.y===head.y)){end();return;}snake.unshift(head);if(eats){score++;$('#score').textContent=score;if(score>best){best=score;saveBest(best);$('#best').textContent=best;}placeFood();}else snake.pop();draw();}function start(){if(over)init();if(running)return;running=true;$('#status').textContent='Go!';$('#start').textContent='Resume';timer=setInterval(tick,125);}function end(){clearInterval(timer);timer=null;running=false;over=true;$('#status').textContent='Game over — score: '+score+'. Press Restart to try again.';}function pause(){if(!running)return;clearInterval(timer);timer=null;running=false;$('#status').textContent='Paused';}function change(d){if(d.x===-dir.x&&d.y===-dir.y)return;next=d;}const dirs={ArrowUp:{x:0,y:-1},w:{x:0,y:-1},ArrowDown:{x:0,y:1},s:{x:0,y:1},ArrowLeft:{x:-1,y:0},a:{x:-1,y:0},ArrowRight:{x:1,y:0},d:{x:1,y:0}};addEventListener('keydown',e=>{if(dirs[e.key]){e.preventDefault();change(dirs[e.key]);}if(e.key===' '){e.preventDefault();running?pause():start();}});document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>change(({up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}})[b.dataset.dir])));let touch=null;canvas.addEventListener('touchstart',e=>{touch={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});canvas.addEventListener('touchend',e=>{if(!touch)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;if(Math.max(Math.abs(dx),Math.abs(dy))>18)change(Math.abs(dx)>Math.abs(dy)?{x:Math.sign(dx),y:0}:{x:0,y:Math.sign(dy)});touch=null;},{passive:true});$('#start').onclick=start;$('#pause').onclick=pause;$('#restart').onclick=()=>{init();start();};init();if('serviceWorker'in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{});})();
</script></body></html>
