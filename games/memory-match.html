<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10111b"><title>Memory Match — DesiPlay</title><link rel="manifest" href="../manifest.webmanifest"><link rel="stylesheet" href="../assets/site.css"></head><body><main class="game-shell"><div class="game-nav"><a class="brand" href="../"><span class="brand-mark">D</span><span>Desi<span class="brand-accent">Play</span><small>PLAY ANYWHERE</small></span></a><a class="back-link" href="../">← All games</a></div><section class="game-panel"><div class="game-heading"><div class="eyebrow" style="justify-content:center">BRAIN BOOST</div><h1>Memory Match</h1><p>Find all eight matching pairs in as few moves as possible.</p></div><div class="score-strip"><span>Moves <strong id="moves">0</strong></span><span>Pairs <strong id="pairs">0 / 8</strong></span><span>Best <strong id="best">—</strong></span></div><div class="game-status" id="status" aria-live="polite">Find the matching pairs!</div><div class="board memory-board" id="board"></div><div class="game-actions"><button class="game-btn" id="new">Shuffle & restart</button></div><p class="game-help">Your best move count is saved on this device.</p></section></main><script>
(()=>{const icons=['🎲','🎯','🎮','🚀','⭐','🎧','🍀','🏆'];let deck=[],first=null,lock=false,moves=0,pairs=0,best=+(localStorage.getItem('desiplay-memory-best')||0);const $=s=>document.querySelector(s);$('#best').textContent=best||'—';function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}function setup(){deck=shuffle([...icons,...icons].map((v,i)=>({v,id:i,open:false,matched:false})));first=null;lock=false;moves=0;pairs=0;$('#moves').textContent=0;$('#pairs').textContent='0 / 8';$('#status').textContent='Find the matching pairs!';const board=$('#board');board.innerHTML='';deck.forEach((c,i)=>{const b=document.createElement('button');b.className='memory-card';b.type='button';b.textContent='?';b.setAttribute('aria-label','Hidden card');b.addEventListener('click',()=>flip(i,b));board.append(b);});}function flip(i,b){const c=deck[i];if(lock||c.open||c.matched)return;c.open=true;b.textContent=c.v;b.classList.add('flipped');b.setAttribute('aria-label',c.v);if(first===null){first=i;return;}moves++;$('#moves').textContent=moves;const a=deck[first];if(a.v===c.v){a.matched=c.matched=true;document.querySelectorAll('.memory-card').forEach((el,j)=>{if(j===first||j===i){el.classList.add('matched');el.disabled=true;}});pairs++;$('#pairs').textContent=pairs+' / 8';first=null;if(pairs===8){$('#status').textContent='🎉 Perfect! You found every pair in '+moves+' moves.';if(!best||moves<best){best=moves;localStorage.setItem('desiplay-memory-best',best);$('#best').textContent=best;}}}else{lock=true;const prev=first;first=null;setTimeout(()=>{[prev,i].forEach(j=>{deck[j].open=false;const el=document.querySelectorAll('.memory-card')[j];el.textContent='?';el.classList.remove('flipped');el.setAttribute('aria-label','Hidden card');});lock=false;},700);}}$('#new').onclick=setup;setup();if('serviceWorker'in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{});})();
</script></body></html>
