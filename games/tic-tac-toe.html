<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10111b"><title>Tic Tac Toe — DesiPlay</title><link rel="manifest" href="../manifest.webmanifest"><link rel="stylesheet" href="../assets/site.css"></head><body><main class="game-shell"><div class="game-nav"><a class="brand" href="../"><span class="brand-mark">D</span><span>Desi<span class="brand-accent">Play</span><small>PLAY ANYWHERE</small></span></a><a class="back-link" href="../">← All games</a></div><section class="game-panel"><div class="game-heading"><div class="eyebrow" style="justify-content:center">CLASSIC DUEL</div><h1>Tic Tac Toe</h1><p>Two players. One board. Who gets three in a row?</p></div><div class="score-strip"><span>Player X <strong id="sx">0</strong></span><span>Draws <strong id="sd">0</strong></span><span>Player O <strong id="so">0</strong></span></div><div class="game-status" id="status" aria-live="polite">Player X's turn</div><div class="board tic-board" id="board" role="group" aria-label="Tic Tac Toe board"><button class="tic-cell" data-i="0" aria-label="Cell 1"></button><button class="tic-cell" data-i="1" aria-label="Cell 2"></button><button class="tic-cell" data-i="2" aria-label="Cell 3"></button><button class="tic-cell" data-i="3" aria-label="Cell 4"></button><button class="tic-cell" data-i="4" aria-label="Cell 5"></button><button class="tic-cell" data-i="5" aria-label="Cell 6"></button><button class="tic-cell" data-i="6" aria-label="Cell 7"></button><button class="tic-cell" data-i="7" aria-label="Cell 8"></button><button class="tic-cell" data-i="8" aria-label="Cell 9"></button></div><div class="game-actions"><button class="game-btn" id="reset">New round</button><button class="game-btn secondary" id="scoresReset">Reset scores</button></div><p class="game-help">Your scores are saved on this device. No sign-in needed.</p></section></main><script>
(()=>{const cells=[...document.querySelectorAll('.tic-cell')],status=document.querySelector('#status'),wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];let board=Array(9).fill(''),turn='X',done=false,score=JSON.parse(localStorage.getItem('desiplay-ttt-score')||'{"X":0,"O":0,"D":0}');function paint(){for(const k of ['X','O','D'])document.querySelector('#s'+k.toLowerCase()).textContent=score[k];}function save(){localStorage.setItem('desiplay-ttt-score',JSON.stringify(score));paint();}function play(i){if(done||board[i])return;board[i]=turn;cells[i].textContent=turn;cells[i].classList.toggle('o',turn==='O');cells[i].disabled=true;const line=wins.find(w=>w.every(n=>board[n]===turn));if(line){done=true;line.forEach(n=>cells[n].style.background='#303b2b');score[turn]++;save();status.textContent='🎉 Player '+turn+' wins!';}else if(board.every(Boolean)){done=true;score.D++;save();status.textContent="It's a draw! Good game.";}else{turn=turn==='X'?'O':'X';status.textContent='Player '+turn+"'s turn";}}function reset(){board=Array(9).fill('');turn='X';done=false;cells.forEach(c=>{c.textContent='';c.disabled=false;c.classList.remove('o');c.style.background='';});status.textContent="Player X's turn";}cells.forEach(c=>c.addEventListener('click',()=>play(+c.dataset.i)));document.querySelector('#reset').onclick=reset;document.querySelector('#scoresReset').onclick=()=>{score={X:0,O:0,D:0};save();reset();};paint();if('serviceWorker'in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{});})();
</script></body></html>
